<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>問い合わせ管理</title>
<style>
:root{--bg:#fff;--soft:#f6f6f6;--line:#e4e4e4;--text:#000;--sub:#6b6b6b;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
h1{font-size:20px;margin:0;font-weight:700}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--text);color:#fff;border-color:var(--text)}
.btn.primary:hover{background:#333}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:28px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat b{display:block;font-size:28px;line-height:1.2;font-weight:700}
.stat span{color:var(--sub);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.tools input,.tools select{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
.tools input{flex:1 1 220px}
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:150px 120px 1fr 90px;gap:16px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--bg);padding:14px 16px;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--soft)}
.row.head{cursor:default;background:var(--soft);color:var(--sub);font-size:13px;padding:10px 16px}
.row.head:hover{background:var(--soft)}
.msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{color:var(--sub);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--text)}
.badge.s1::before{background:var(--text)}
.badge.s2::before{background:linear-gradient(90deg,var(--text) 50%,transparent 50%)}
.empty{padding:40px 16px;text-align:center;color:var(--sub)}
.note{color:var(--sub);font-size:13px;margin-top:12px}
.err{color:#b00020;font-size:14px;min-height:1.4em;margin:8px 0 0}
#login{max-width:360px;margin:18vh auto 0}
#login h1{margin-bottom:20px}
#login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
#login .btn{width:100%}
dialog{border:1px solid var(--line);border-radius:14px;padding:24px;width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dl{margin:16px 0}
dt{color:var(--sub);font-size:13px;margin-top:14px}
dd{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.dh{display:flex;justify-content:space-between;align-items:center}
.hide{display:none!important}
@media(max-width:720px){
.stats{grid-template-columns:repeat(2,1fr)}
.row{grid-template-columns:1fr auto;gap:4px 12px}
.row.head{display:none}
.row .msg{grid-column:1/3;order:3;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}
</style>
</head>
<body>

<section id="login" class="hide">
  <h1>問い合わせ管理</h1>
  <input id="pw" type="password" placeholder="パスワード" autocomplete="current-password" aria-label="パスワード">
  <button id="loginBtn" class="btn primary">ログイン</button>
  <p id="loginErr" class="err" role="alert"></p>
</section>

<main id="app" class="wrap hide">
  <header>
    <h1>問い合わせ管理</h1>
    <button id="logout" class="btn">ログアウト</button>
  </header>

  <section class="stats" aria-label="件数">
    <div class="stat"><b id="n-all">-</b><span>総問い合わせ</span></div>
    <div class="stat"><b id="n-s0">-</b><span>未対応</span></div>
    <div class="stat"><b id="n-s1">-</b><span>対応中</span></div>
    <div class="stat"><b id="n-s2">-</b><span>対応済み</span></div>
    <div class="stat"><b id="n-today">-</b><span>今日</span></div>
  </section>

  <div class="tools">
    <input id="q" type="search" placeholder="メッセージを検索" aria-label="メッセージを検索">
    <select id="fKw" aria-label="キーワード"><option value="">すべてのキーワード</option></select>
    <select id="fSt" aria-label="ステータス">
      <option value="">すべてのステータス</option>
      <option>未対応</option><option>対応中</option><option>対応済み</option>
    </select>
    <select id="fSort" aria-label="並び順">
      <option value="desc">新しい順</option>
      <option value="asc">古い順</option>
    </select>
  </div>

  <div class="list" id="list"></div>
  <p class="note" id="note"></p>
</main>

<dialog id="dlg">
  <div class="dh"><h2 style="margin:0;font-size:17px">問い合わせ詳細</h2><button class="btn" id="dClose">閉じる</button></div>
  <dl>
    <dt>受信日時</dt><dd id="dDate"></dd>
    <dt>検知キーワード</dt><dd id="dKw"></dd>
    <dt>メッセージ</dt><dd id="dMsg"></dd>
    <dt>ステータス</dt><dd id="dSt"></dd>
  </dl>
  <div class="tools" id="dBtns" style="margin:0"></div>
  <p class="err" id="dErr" role="alert"></p>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const STATUS = ["未対応", "対応中", "対応済み"];
let items = [];
let timer = null;

async function api(action, opts) {
  const r = await fetch("/api/admin?action=" + action, opts);
  if (r.status === 401) throw new Error("401");
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}

function show(loggedIn) {
  $("login").classList.toggle("hide", loggedIn);
  $("app").classList.toggle("hide", !loggedIn);
}

function fmt(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function dayKey(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleDateString("ja-JP", { timeZone: "Asia/Tokyo" });
}

function badge(status) {
  const s = document.createElement("span");
  s.className = "badge s" + Math.max(0, STATUS.indexOf(status));
  s.textContent = status;
  return s;
}

function renderStats() {
  const today = dayKey(new Date().toISOString());
  $("n-all").textContent = items.length;
  STATUS.forEach((s, i) => { $("n-s" + i).textContent = items.filter((x) => x.status === s).length; });
  $("n-today").textContent = items.filter((x) => dayKey(x.receivedAt) === today).length;
}

function renderKeywordOptions() {
  const sel = $("fKw");
  const cur = sel.value;
  const kws = [...new Set(items.map((x) => x.keyword))].sort();
  sel.length = 1;
  kws.forEach((k) => { const o = document.createElement("option"); o.value = k; o.textContent = k; sel.appendChild(o); });
  sel.value = kws.includes(cur) ? cur : "";
}

function renderList() {
  const q = $("q").value.trim().toLowerCase();
  const kw = $("fKw").value, st = $("fSt").value, dir = $("fSort").value;
  const rows = items
    .filter((x) => (!q || x.message.toLowerCase().includes(q)) && (!kw || x.keyword === kw) && (!st || x.status === st))
    .sort((a, b) => (new Date(a.receivedAt) - new Date(b.receivedAt)) || (a.id - b.id));
  if (dir === "desc") rows.reverse();

  const list = $("list");
  list.replaceChildren();
  if (rows.length === 0) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = items.length === 0 ? "まだ問い合わせはありません。" : "条件に合う問い合わせはありません。";
    list.appendChild(e);
  } else {
    const head = document.createElement("div");
    head.className = "row head";
    ["受信日時", "キーワード", "メッセージ", "ステータス"].forEach((t) => { const s = document.createElement("span"); s.textContent = t; head.appendChild(s); });
    list.appendChild(head);
    rows.forEach((x) => {
      const b = document.createElement("button");
      b.className = "row";
      b.type = "button";
      const d = document.createElement("span"); d.className = "date"; d.textContent = fmt(x.receivedAt);
      const k = document.createElement("span"); k.textContent = x.keyword;
      const m = document.createElement("span"); m.className = "msg"; m.textContent = x.message;
      b.append(d, k, m, badge(x.status));
      b.addEventListener("click", () => openDetail(x));
      list.appendChild(b);
    });
  }
  $("note").textContent = rows.length + " 件を表示(全 " + items.length + " 件)。30秒ごとに自動更新します。";
}

function openDetail(x) {
  $("dDate").textContent = fmt(x.receivedAt);
  $("dKw").textContent = x.keyword;
  $("dMsg").textContent = x.message;
  $("dSt").replaceChildren(badge(x.status));
  renderStatusButtons(x);
  $("dlg").showModal();
}

function renderStatusButtons(x) {
  const box = $("dBtns");
  box.replaceChildren();
  $("dErr").textContent = "";
  STATUS.forEach((s) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn" + (s === x.status ? " primary" : "");
    b.textContent = s;
    b.addEventListener("click", () => setStatus(x, s));
    box.appendChild(b);
  });
}

async function setStatus(x, s) {
  if (s === x.status) return;
  $("dErr").textContent = "";
  try {
    const r = await fetch("/api/admin?action=status", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: x.id, status: s })
    });
    if (r.status === 401) { $("dlg").close(); load(); return; }
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error("failed");
    x.status = s;
    $("dSt").replaceChildren(badge(s));
    renderStatusButtons(x);
    renderStats();
    renderList();
  } catch (e) {
    $("dErr").textContent = "ステータスを変更できませんでした。もう一度お試しください。";
  }
}

async function load() {
  try {
    const data = await api("list");
    items = data.items || [];
    renderStats();
    renderKeywordOptions();
    renderList();
    show(true);
    if (!timer) timer = setInterval(load, 30000);
  } catch (e) {
    if (e.message === "401") {
      clearInterval(timer); timer = null;
      show(false);
    } else {
      $("note").textContent = "データを取得できませんでした。しばらくしてからもう一度お試しください。";
      show(true);
    }
  }
}

$("loginBtn").addEventListener("click", async () => {
  $("loginErr").textContent = "";
  try {
    const r = await fetch("/api/admin?action=login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("pw").value })
    });
    if (r.status === 401) { $("loginErr").textContent = "パスワードが違います。"; return; }
    if (!r.ok) { $("loginErr").textContent = "ログインできませんでした。設定を確認してください。"; return; }
    $("pw").value = "";
    load();
  } catch (e) {
    $("loginErr").textContent = "通信に失敗しました。";
  }
});
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });

$("logout").addEventListener("click", async () => {
  await fetch("/api/admin?action=logout", { method: "POST" });
  clearInterval(timer); timer = null; items = [];
  show(false);
});

["q", "fKw", "fSt", "fSort"].forEach((id) => $(id).addEventListener("input", renderList));
$("dClose").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("click", (e) => { if (e.target === $("dlg")) $("dlg").close(); });

load();
</script>
</body>
</html>
